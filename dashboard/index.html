<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pebble 91Dub E-Ink Wall Clock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
/* Pebble 91Dub E-Ink Clock Stylesheet */
/* Optimized for E-Ink Pearl displays & legacy Android 2.1 WebKit */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #000000;
  font-family: monospace, sans-serif;
}

#viewport {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: -webkit-box;
  display: -moz-box;
  display: box;
  display: flex;
  -webkit-box-pack: center;
  -moz-box-pack: center;
  justify-content: center;
  -webkit-box-align: center;
  -moz-box-align: center;
  align-items: center;
  background-color: #000000;
}

/* 4x integer scaled Pebble canvas (144x168 -> 576x672) */
#pebble-screen {
  position: relative;
  width: 576px;
  height: 672px;
  background-color: #ffffff;
  overflow: hidden;
  /* Ensure pixelated crisp edges on e-ink and high-res screens */
  image-rendering: -webkit-optimize-contrast;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
}

/* Background layers */
#bg-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 576px;
  height: 672px;
}

#branding-mask-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 576px;
  height: 76px;
  display: none;
}

/* Status row: Meter, Bluetooth, Battery */
#meter-layer {
  position: absolute;
  top: 172px;
  left: 68px;
  width: 48px;
  height: 36px;
}

#bluetooth-layer {
  position: absolute;
  top: 172px;
  left: 132px;
  width: 28px;
  height: 36px;
}

#battery-bar {
  position: absolute;
  top: 180px;
  left: 452px;
  width: 44px;
  height: 20px;
  background-color: #000000;
  z-index: 2;
}

#battery-icon-layer {
  position: absolute;
  top: 172px;
  left: 444px;
  width: 64px;
  height: 36px;
  z-index: 3;
}

#battery-percent-tens {
  position: absolute;
  top: 172px;
  left: 356px;
  width: 20px;
  height: 32px;
}

#battery-percent-units {
  position: absolute;
  top: 172px;
  left: 380px;
  width: 20px;
  height: 32px;
}

#battery-percent-symbol {
  position: absolute;
  top: 172px;
  left: 404px;
  width: 28px;
  height: 28px;
}

/* Time format (24H or PM) */
#time-format-layer {
  position: absolute;
  top: 272px;
  left: 68px;
  width: 76px;
  height: 32px;
  display: none;
}

/* Day & Date */
#day-name-layer {
  position: absolute;
  top: 244px;
  left: 276px;
  width: 136px;
  height: 60px;
}

#date-digit-tens {
  position: absolute;
  top: 244px;
  left: 432px;
  width: 40px;
  height: 60px;
}

#date-digit-units {
  position: absolute;
  top: 244px;
  left: 484px;
  width: 40px;
  height: 60px;
}

/* Big Time Group (Default Mode) */
#big-time-group {
  position: absolute;
  top: 0;
  left: 0;
  width: 576px;
  height: 672px;
}

#time-digit-hour-tens {
  position: absolute;
  top: 336px;
  left: 40px;
  width: 104px;
  height: 164px;
}

#time-digit-hour-units {
  position: absolute;
  top: 336px;
  left: 160px;
  width: 104px;
  height: 164px;
}

#separator-layer {
  position: absolute;
  top: 364px;
  left: 276px;
  width: 24px;
  height: 108px;
}

#time-digit-min-tens {
  position: absolute;
  top: 336px;
  left: 308px;
  width: 104px;
  height: 164px;
}

#time-digit-min-units {
  position: absolute;
  top: 336px;
  left: 420px;
  width: 104px;
  height: 164px;
}

/* Medium Time Group (Seconds Mode) */
#med-time-group {
  position: absolute;
  top: 0;
  left: 0;
  width: 576px;
  height: 672px;
  display: none;
}

#med-digit-hour-tens {
  position: absolute;
  top: 352px;
  left: 48px;
  width: 80px;
  height: 128px;
}

#med-digit-hour-units {
  position: absolute;
  top: 352px;
  left: 140px;
  width: 80px;
  height: 128px;
}

#med-separator-layer {
  position: absolute;
  top: 372px;
  left: 228px;
  width: 20px;
  height: 104px;
}

#med-digit-min-tens {
  position: absolute;
  top: 352px;
  left: 260px;
  width: 80px;
  height: 128px;
}

#med-digit-min-units {
  position: absolute;
  top: 352px;
  left: 348px;
  width: 80px;
  height: 128px;
}

#sec-digit-tens {
  position: absolute;
  top: 416px;
  left: 436px;
  width: 40px;
  height: 60px;
}

#sec-digit-units {
  position: absolute;
  top: 416px;
  left: 484px;
  width: 40px;
  height: 60px;
}

/* Invert / "Junkie Mode" */
.inverted {
  -webkit-filter: invert(100%);
  -moz-filter: invert(100%);
  -o-filter: invert(100%);
  -ms-filter: invert(100%);
  filter: invert(100%);
}

/* Anti-Ghosting Flash Screen */
#eink-flash {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #ffffff;
  z-index: 999;
  display: none;
}

/* Settings Touch Drawer */
#settings-panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  background: #ffffff;
  color: #000000;
  border-bottom: 4px solid #000000;
  padding: 16px;
  z-index: 100;
  display: none;
  font-size: 18px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

#settings-panel h2 {
  font-size: 22px;
  text-align: center;
  margin-bottom: 12px;
  border-bottom: 2px solid #000;
  padding-bottom: 6px;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.setting-btn {
  background: #ffffff;
  color: #000000;
  border: 2px solid #000000;
  padding: 8px 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.setting-btn.active {
  background: #000000;
  color: #ffffff;
}

.close-btn {
  width: 100%;
  margin-top: 10px;
  background: #000000;
  color: #ffffff;
  border: none;
  padding: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

/* Tap targets for touching Nook screen */
#top-touch-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  z-index: 50;
  cursor: pointer;
}

#bottom-touch-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 60px;
  z-index: 50;
  cursor: pointer;
}

</style>
</head>
<body>
  <div id="viewport">
    <!-- Tap triggers -->
    <div id="top-touch-bar" title="Tap for Settings"></div>
    <div id="bottom-touch-bar" title="Tap to Clear E-Ink Ghosting"></div>

    <!-- 4x Scaled Pebble Watch Screen -->
    <div id="pebble-screen">
      <!-- Background & Branding -->
      <img id="bg-layer" src="assets/images/background.png" alt="Background">
      <img id="branding-mask-layer" src="assets/images/branding-mask.png" alt="Branding Mask">

      <!-- Status Bar -->
      <img id="meter-layer" src="assets/images/icon_meter.png" alt="Meter">
      <img id="bluetooth-layer" src="assets/images/icon_bluetooth.png" alt="Bluetooth">
      <div id="battery-bar"></div>
      <img id="battery-icon-layer" src="assets/images/icon_battery.png" alt="Battery">
      <img id="battery-percent-tens" src="assets/images/tiny_1.png" alt="Bat Tens">
      <img id="battery-percent-units" src="assets/images/tiny_0.png" alt="Bat Units">
      <img id="battery-percent-symbol" src="assets/images/tiny_percent.png" alt="%">

      <!-- Time Format & Date -->
      <img id="time-format-layer" src="assets/images/time_format_24H.png" alt="Time Format">
      <img id="day-name-layer" src="assets/images/day_mon.png" alt="Day">
      <img id="date-digit-tens" src="assets/images/datenum_0.png" alt="Date Tens">
      <img id="date-digit-units" src="assets/images/datenum_1.png" alt="Date Units">

      <!-- Big Digits (Standard Mode) -->
      <div id="big-time-group">
        <img id="time-digit-hour-tens" src="assets/images/num_1.png" alt="H1">
        <img id="time-digit-hour-units" src="assets/images/num_2.png" alt="H2">
        <img id="separator-layer" src="assets/images/separator.png" alt=":">
        <img id="time-digit-min-tens" src="assets/images/num_3.png" alt="M1">
        <img id="time-digit-min-units" src="assets/images/num_4.png" alt="M2">
      </div>

      <!-- Medium Digits & Seconds (Seconds Mode) -->
      <div id="med-time-group">
        <img id="med-digit-hour-tens" src="assets/images/med-1.png" alt="Med H1">
        <img id="med-digit-hour-units" src="assets/images/med-2.png" alt="Med H2">
        <img id="med-separator-layer" src="assets/images/med-separator.png" alt=":">
        <img id="med-digit-min-tens" src="assets/images/med-3.png" alt="Med M1">
        <img id="med-digit-min-units" src="assets/images/med-4.png" alt="Med M2">
        <img id="sec-digit-tens" src="assets/images/sm-0.png" alt="S1">
        <img id="sec-digit-units" src="assets/images/sm-0.png" alt="S2">
      </div>
    </div>

    <!-- Waveform Anti-Ghosting Flash Screen -->
    <div id="eink-flash"></div>

    <!-- Settings Touch Panel -->
    <div id="settings-panel">
      <h2>91Dub Clock Settings</h2>
      
      <div class="setting-row">
        <span>Time Format:</span>
        <div>
          <button id="btn-format-12" class="setting-btn">12H</button>
          <button id="btn-format-24" class="setting-btn active">24H</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Seconds Display:</span>
        <div>
          <button id="btn-seconds-off" class="setting-btn active">Off</button>
          <button id="btn-seconds-on" class="setting-btn">On</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Colon Separator:</span>
        <div>
          <button id="btn-colon-solid" class="setting-btn active">Solid</button>
          <button id="btn-colon-blink" class="setting-btn">Blink</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Color Theme:</span>
        <div>
          <button id="btn-invert-off" class="setting-btn active">Normal</button>
          <button id="btn-invert-on" class="setting-btn">Invert</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Pebble Logo:</span>
        <div>
          <button id="btn-brand-show" class="setting-btn active">Show</button>
          <button id="btn-brand-hide" class="setting-btn">Hide</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Anti-Ghosting:</span>
        <button id="btn-force-clear" class="setting-btn">Clear Screen Now</button>
      </div>

      <button id="close-settings-btn" class="close-btn">Done / Save</button>
    </div>
  </div>

/**
 * Pebble 91Dub E-Ink Clock Engine
 * Pure ES3/ES5 JavaScript - Compatible with Android 2.1 Eclair & modern browsers
 */

(function () {
  'use strict';

  // Config & State
  var settings = {
    is24h: true,
    showSeconds: false,
    blinkColon: false, // Default false for e-ink power saving
    invert: false,
    brandingMask: false, // false = show "PEBBLE" logo
    ghostClearMinutes: 30, // Periodic anti-ghosting waveform refresh
    batteryPercent: 100,
    isCharging: false
  };

  // Asset path resolver (overridden if ASSETS_MAP is provided)
  function getAsset(name) {
    if (window.EMBEDDED_ASSETS && window.EMBEDDED_ASSETS[name]) {
      return window.EMBEDDED_ASSETS[name];
    }
    return 'assets/images/' + name;
  }

  // Load settings from localStorage
  function loadSettings() {
    try {
      if (window.localStorage) {
        var saved = localStorage.getItem('pebble_91dub_settings');
        if (saved) {
          var parsed = JSON.parse(saved);
          for (var key in parsed) {
            if (parsed.hasOwnProperty(key)) {
              settings[key] = parsed[key];
            }
          }
        }
      }
    } catch (e) {
      // Ignore localStorage errors in restricted webviews
    }
  }

  function saveSettings() {
    try {
      if (window.localStorage) {
        localStorage.setItem('pebble_91dub_settings', JSON.stringify(settings));
      }
    } catch (e) {
      // Ignore
    }
  }

  // DOM Elements cache
  var el = {};
  function cacheElements() {
    el.screen = document.getElementById('pebble-screen');
    el.bg = document.getElementById('bg-layer');
    el.brandingMask = document.getElementById('branding-mask-layer');
    el.meter = document.getElementById('meter-layer');
    el.bluetooth = document.getElementById('bluetooth-layer');
    el.batteryBar = document.getElementById('battery-bar');
    el.batteryIcon = document.getElementById('battery-icon-layer');
    el.batTens = document.getElementById('battery-percent-tens');
    el.batUnits = document.getElementById('battery-percent-units');
    el.batSymbol = document.getElementById('battery-percent-symbol');
    el.timeFormat = document.getElementById('time-format-layer');
    el.dayName = document.getElementById('day-name-layer');
    el.dateTens = document.getElementById('date-digit-tens');
    el.dateUnits = document.getElementById('date-digit-units');

    // Big time
    el.bigGroup = document.getElementById('big-time-group');
    el.hourTens = document.getElementById('time-digit-hour-tens');
    el.hourUnits = document.getElementById('time-digit-hour-units');
    el.separator = document.getElementById('separator-layer');
    el.minTens = document.getElementById('time-digit-min-tens');
    el.minUnits = document.getElementById('time-digit-min-units');

    // Medium time (Seconds mode)
    el.medGroup = document.getElementById('med-time-group');
    el.medHourTens = document.getElementById('med-digit-hour-tens');
    el.medHourUnits = document.getElementById('med-digit-hour-units');
    el.medSeparator = document.getElementById('med-separator-layer');
    el.medMinTens = document.getElementById('med-digit-min-tens');
    el.medMinUnits = document.getElementById('med-digit-min-units');
    el.secTens = document.getElementById('sec-digit-tens');
    el.secUnits = document.getElementById('sec-digit-units');

    el.einkFlash = document.getElementById('eink-flash');
    el.settingsPanel = document.getElementById('settings-panel');
  }

  var dayNames = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

  // Apply visual theme & static graphics
  function applyTheme() {
    var bgFile = settings.invert ? 'background-invert.png' : 'background.png';
    var maskFile = settings.invert ? 'branding-mask-invert.png' : 'branding-mask.png';

    el.bg.src = getAsset(bgFile);
    el.brandingMask.src = getAsset(maskFile);
    el.brandingMask.style.display = settings.brandingMask ? 'block' : 'none';

    el.meter.src = getAsset('icon_meter.png');
    el.bluetooth.src = getAsset('icon_bluetooth.png');
    el.batSymbol.src = getAsset('tiny_percent.png');

    el.separator.src = getAsset('separator.png');
    el.medSeparator.src = getAsset('med-separator.png');

    if (settings.invert) {
      el.batteryBar.style.backgroundColor = '#ffffff';
    } else {
      el.batteryBar.style.backgroundColor = '#000000';
    }

    if (settings.showSeconds) {
      el.bigGroup.style.display = 'none';
      el.medGroup.style.display = 'block';
    } else {
      el.bigGroup.style.display = 'block';
      el.medGroup.style.display = 'none';
    }
  }

  // Update battery graphic
  function updateBatteryUI() {
    var pct = settings.batteryPercent;
    var charging = settings.isCharging;

    el.batteryIcon.src = getAsset(charging ? 'icon_battery_charge.png' : 'icon_battery.png');

    // Draw battery fill bar (up to 44px wide at 4x scale)
    var barWidth = Math.round((pct / 100.0) * 44);
    el.batteryBar.style.width = barWidth + 'px';

    if (pct >= 100) {
      el.batTens.style.display = 'none';
      el.batUnits.style.display = 'none';
      el.batSymbol.style.display = 'none';
      el.batteryBar.style.display = 'block';
    } else {
      el.batTens.style.display = 'block';
      el.batUnits.style.display = 'block';
      el.batSymbol.style.display = 'block';
      el.batTens.src = getAsset('tiny_' + Math.floor(pct / 10) + '.png');
      el.batUnits.src = getAsset('tiny_' + (pct % 10) + '.png');
      el.batteryBar.style.display = 'block';
    }
  }

  // Check battery API if supported
  function initBattery() {
    try {
      if (navigator.getBattery) {
        navigator.getBattery().then(function (battery) {
          function onBatChange() {
            settings.batteryPercent = Math.round(battery.level * 100);
            settings.isCharging = battery.charging;
            updateBatteryUI();
          }
          onBatChange();
          battery.addEventListener('levelchange', onBatChange);
          battery.addEventListener('chargingchange', onBatChange);
        });
      } else {
        updateBatteryUI();
      }
    } catch (e) {
      updateBatteryUI();
    }
  }

  var lastMinute = -1;
  var lastDay = -1;
  var lastHour = -1;

  // Clock Update Routine
  function updateClock() {
    var now = new Date();
    var hours = now.getHours();
    var minutes = now.getMinutes();
    var seconds = now.getSeconds();
    var dayOfWeek = now.getDay();
    var dateNum = now.getDate();

    // 1. Update Day and Date if changed
    if (dateNum !== lastDay) {
      el.dayName.src = getAsset('day_' + dayNames[dayOfWeek] + '.png');
      el.dateTens.src = getAsset('datenum_' + Math.floor(dateNum / 10) + '.png');
      el.dateUnits.src = getAsset('datenum_' + (dateNum % 10) + '.png');
      lastDay = dateNum;
    }

    // 2. Format Hour
    var displayHour = hours;
    var isPM = hours >= 12;

    if (!settings.is24h) {
      displayHour = hours % 12;
      if (displayHour === 0) {
        displayHour = 12;
      }
      if (isPM) {
        el.timeFormat.src = getAsset('time_format_PM.png');
        el.timeFormat.style.display = 'block';
      } else {
        el.timeFormat.style.display = 'none';
      }
    } else {
      el.timeFormat.src = getAsset('time_format_24H.png');
      el.timeFormat.style.display = 'block';
    }

    // 3. Render Digits
    var hTens = Math.floor(displayHour / 10);
    var hUnits = displayHour % 10;
    var mTens = Math.floor(minutes / 10);
    var mUnits = minutes % 10;
    var sTens = Math.floor(seconds / 10);
    var sUnits = seconds % 10;

    if (settings.showSeconds) {
      // Medium layout
      if (!settings.is24h && hTens === 0) {
        el.medHourTens.style.display = 'none';
      } else {
        el.medHourTens.src = getAsset('med-' + hTens + '.png');
        el.medHourTens.style.display = 'block';
      }
      el.medHourUnits.src = getAsset('med-' + hUnits + '.png');
      el.medMinTens.src = getAsset('med-' + mTens + '.png');
      el.medMinUnits.src = getAsset('med-' + mUnits + '.png');

      el.secTens.src = getAsset('sm-' + sTens + '.png');
      el.secUnits.src = getAsset('sm-' + sUnits + '.png');

      if (settings.blinkColon) {
        el.medSeparator.style.visibility = (seconds % 2 === 0) ? 'visible' : 'hidden';
      } else {
        el.medSeparator.style.visibility = 'visible';
      }
    } else {
      // Big bold layout
      if (!settings.is24h && hTens === 0) {
        el.hourTens.style.display = 'none';
      } else {
        el.hourTens.src = getAsset('num_' + hTens + '.png');
        el.hourTens.style.display = 'block';
      }
      el.hourUnits.src = getAsset('num_' + hUnits + '.png');
      el.minTens.src = getAsset('num_' + mTens + '.png');
      el.minUnits.src = getAsset('num_' + mUnits + '.png');

      if (settings.blinkColon) {
        el.separator.style.visibility = (seconds % 2 === 0) ? 'visible' : 'hidden';
      } else {
        el.separator.style.visibility = 'visible';
      }
    }

    lastMinute = minutes;
    lastHour = hours;

    // Periodic Anti-Ghosting E-Ink Refresh Check
    if (settings.ghostClearMinutes > 0 && minutes % settings.ghostClearMinutes === 0 && seconds === 0) {
      triggerEinkClear();
    }
  }

  // Anti-Ghosting E-Ink Waveform Flasher
  function triggerEinkClear() {
    if (!el.einkFlash) return;
    el.einkFlash.style.backgroundColor = '#000000';
    el.einkFlash.style.display = 'block';

    setTimeout(function () {
      el.einkFlash.style.backgroundColor = '#ffffff';
      setTimeout(function () {
        el.einkFlash.style.display = 'none';
      }, 150);
    }, 150);
  }

  // Timer loop scheduler
  var timerId = null;
  function scheduleNextTick() {
    if (timerId) {
      clearTimeout(timerId);
      timerId = null;
    }

    updateClock();

    if (settings.showSeconds || settings.blinkColon) {
      // 1-second interval
      var now = new Date();
      var delay = 1000 - now.getMilliseconds();
      timerId = setTimeout(scheduleNextTick, delay);
    } else {
      // Minute-aligned interval: wake up right on :00 seconds!
      var now = new Date();
      var msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds() + 50;
      timerId = setTimeout(scheduleNextTick, msUntilNextMinute);
    }
  }

  // Responsive scaler: scales 576x672 to fit any screen
  function handleResize() {
    var vw = window.innerWidth || document.documentElement.clientWidth || 600;
    var vh = window.innerHeight || document.documentElement.clientHeight || 800;

    var scaleX = vw / 576;
    var scaleY = vh / 672;
    var scale = Math.min(scaleX, scaleY);

    // If screen is approximately 600x800, use exact 1.0 (4x Pebble pixels)
    if (vw >= 576 && vh >= 672 && Math.abs(scale - 1.0) < 0.2) {
      scale = 1.0;
    }

    var styleStr = 'scale(' + scale + ')';
    el.screen.style.webkitTransform = styleStr;
    el.screen.style.mozTransform = styleStr;
    el.screen.style.msTransform = styleStr;
    el.screen.style.transform = styleStr;
    el.screen.style.webkitTransformOrigin = 'center center';
    el.screen.style.transformOrigin = 'center center';
  }

  // Settings UI Interaction
  function initSettingsUI() {
    var topBar = document.getElementById('top-touch-bar');
    var bottomBar = document.getElementById('bottom-touch-bar');
    var closeBtn = document.getElementById('close-settings-btn');

    if (topBar) {
      topBar.onclick = function () {
        el.settingsPanel.style.display = 'block';
      };
    }

    if (bottomBar) {
      bottomBar.onclick = function () {
        triggerEinkClear();
      };
    }

    if (closeBtn) {
      closeBtn.onclick = function () {
        el.settingsPanel.style.display = 'none';
        saveSettings();
        applyTheme();
        scheduleNextTick();
      };
    }

    // Bind setting toggle buttons
    bindToggle('btn-format-12', 'btn-format-24', function (isA) {
      settings.is24h = !isA;
      updateClock();
    }, !settings.is24h);

    bindToggle('btn-seconds-off', 'btn-seconds-on', function (isA) {
      settings.showSeconds = !isA;
      applyTheme();
      scheduleNextTick();
    }, !settings.showSeconds);

    bindToggle('btn-colon-solid', 'btn-colon-blink', function (isA) {
      settings.blinkColon = !isA;
      scheduleNextTick();
    }, !settings.blinkColon);

    bindToggle('btn-invert-off', 'btn-invert-on', function (isA) {
      settings.invert = !isA;
      applyTheme();
      updateBatteryUI();
    }, !settings.invert);

    bindToggle('btn-brand-show', 'btn-brand-hide', function (isA) {
      settings.brandingMask = !isA;
      applyTheme();
    }, !settings.brandingMask);

    var clearBtn = document.getElementById('btn-force-clear');
    if (clearBtn) {
      clearBtn.onclick = function () {
        triggerEinkClear();
      };
    }
  }

  function bindToggle(idA, idB, callback, initIsA) {
    var btnA = document.getElementById(idA);
    var btnB = document.getElementById(idB);
    if (!btnA || !btnB) return;

    function setUI(isA) {
      if (isA) {
        btnA.className = 'setting-btn active';
        btnB.className = 'setting-btn';
      } else {
        btnA.className = 'setting-btn';
        btnB.className = 'setting-btn active';
      }
    }

    setUI(initIsA);

    btnA.onclick = function () {
      setUI(true);
      callback(true);
    };
    btnB.onclick = function () {
      setUI(false);
      callback(false);
    };
  }

  // Initialization
  function init() {
    loadSettings();
    cacheElements();
    applyTheme();
    initBattery();
    initSettingsUI();
    handleResize();

    window.onresize = handleResize;

    // Start tick loop
    scheduleNextTick();
  }

  if (document.readyState === 'complete' || document.readyState === 'loaded') {
    init();
  } else {
    window.onload = init;
  }

})();

</script>
